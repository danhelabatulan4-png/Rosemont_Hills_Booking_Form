<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rosemont Hills Montessori College - Booking Form</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="container">

    <header class="site-header">
      <h1>Rosemont Hills Montessori College</h1>
      <p>Booking Form</p>
    </header>

    <form id="bookingForm">

      <section class="card">
        <h2>Guest Details</h2>

        <label for="fullName">Full Name *</label>
        <input type="text" id="fullName" required>

        <label for="email">Email Address *</label>
        <input type="email" id="email" required>

        <label for="phone">Phone Number *</label>
        <input type="tel" id="phone" required>
      </section>

      <section class="card">
        <h2>Reservation Details</h2>

        <label for="checkIn">Check-In Date *</label>
        <input type="date" id="checkIn" required>

        <label for="checkOut">Check-Out Date *</label>
        <input type="date" id="checkOut" required>

        <label for="roomType">Room Selection *</label>
        <select id="roomType" required>
          <option value="">Select a room</option>
          <option>Deluxe Suite</option>
          <option>Ocean View Villa</option>
          <option>Standard Room</option>
          <option>Family Suite</option>
        </select>

        <label for="guests">Number of Guests *</label>
        <select id="guests" required>
          <option value="">Select number of guests</option>
          <option>1 Adult</option>
          <option>2 Adults</option>
          <option>2 Adults, 1 Child</option>
          <option>2 Adults, 2 Children</option>
          <option>3 Adults</option>
          <option>4 Adults</option>
        </select>
      </section>

      <section class="card">
        <h2>Additional Information</h2>

        <label for="specialRequests">
          Special Requests <small>(optional)</small>
        </label>

        <textarea
          id="specialRequests"
          rows="5"
          placeholder="Enter any special requests..."
        ></textarea>
      </section>

      <div id="message"></div>

      <button type="submit">Check Availability</button>

    </form>

  </main>

  <script src="script.js"></script>

</body>
</html>
